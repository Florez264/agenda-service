spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/agenda_db?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:agenda_app}
spring.datasource.password=${DB_PASSWORD:agenda-local-password}

spring.flyway.user=${DB_MIGRATION_USER:agenda_migration}
spring.flyway.password=${DB_MIGRATION_PASSWORD:agenda-migration-local}
taller.auth.asesores[0].usuario=${API_USER:asesor}
taller.auth.asesores[0].password=${API_PASSWORD:asesor-local-password}
taller.internal.usuario=${INTERNAL_USER:agenda-internal}
taller.internal.password=${INTERNAL_PASSWORD:internal-local-password}

taller.ordenes.url=${ORDENES_URL:http://localhost:8081}

taller.auth.asesores[1].usuario=${API_SECOND_USER:asesor2}
taller.auth.asesores[1].password=${API_SECOND_PASSWORD:asesor2-local-password}

spring.config.import=optional:file:./.env.local[.properties]

taller.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

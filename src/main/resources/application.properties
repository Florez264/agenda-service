spring.application.name=agenda-service
spring.profiles.default=local
server.port=${PORT:${SERVER_PORT:8082}}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO

spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
taller.auth.asesores[0].usuario=${API_USER}
taller.auth.asesores[0].password=${API_PASSWORD}
taller.internal.usuario=${INTERNAL_USER}
taller.internal.password=${INTERNAL_PASSWORD}

taller.ordenes.url=${ORDENES_URL:http://localhost:8081}


taller.notificaciones.modo=${NOTIFICATIONS_MODE:LOG}
taller.notificaciones.worker-enabled=${NOTIFICATIONS_WORKER_ENABLED:true}
taller.notificaciones.poll-delay-ms=${NOTIFICATIONS_POLL_DELAY_MS:30000}
taller.notificaciones.initial-delay-ms=${NOTIFICATIONS_INITIAL_DELAY_MS:10000}
taller.notificaciones.lote=${NOTIFICATIONS_BATCH_SIZE:5}
taller.notificaciones.max-intentos=${NOTIFICATIONS_MAX_ATTEMPTS:3}
taller.notificaciones.segundos-reserva=${NOTIFICATIONS_LEASE_SECONDS:60}
taller.notificaciones.segundos-reintento=${NOTIFICATIONS_RETRY_SECONDS:30}
taller.notificaciones.whatsapp.api-version=${WHATSAPP_API_VERSION:v25.0}
taller.notificaciones.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
taller.notificaciones.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
taller.notificaciones.whatsapp.test-recipient=${WHATSAPP_TEST_RECIPIENT:}
taller.notificaciones.whatsapp.country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:57}
taller.notificaciones.whatsapp.time-zone=${WHATSAPP_TIME_ZONE:America/Bogota}
taller.notificaciones.whatsapp.agendada.nombre=${WHATSAPP_TEMPLATE_SCHEDULED:hello_world}
taller.notificaciones.whatsapp.agendada.idioma=${WHATSAPP_TEMPLATE_SCHEDULED_LANGUAGE:en_US}
taller.notificaciones.whatsapp.agendada.parametros=${WHATSAPP_TEMPLATE_SCHEDULED_PARAMS:}
taller.notificaciones.whatsapp.cancelada.nombre=${WHATSAPP_TEMPLATE_CANCELLED:hello_world}
taller.notificaciones.whatsapp.cancelada.idioma=${WHATSAPP_TEMPLATE_CANCELLED_LANGUAGE:en_US}
taller.notificaciones.whatsapp.cancelada.parametros=${WHATSAPP_TEMPLATE_CANCELLED_PARAMS:}

taller.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
